name: Angular CI/CD to GitHub Pages

on:
  push:
    branches:
      - main # your default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist-path: ${{ steps.build.outputs.dist-path }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Build Angular
        id: build
        run: |
          ng build --base-href /
          echo "dist-path=dist/portfolio/browser" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to GH Pages
        run: npx angular-cli-ghpages --dir=${{ needs.build.outputs.dist-path }} --branch=gh-pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PAT }}
