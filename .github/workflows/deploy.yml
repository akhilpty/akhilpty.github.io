name: Angular CI/CD to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Triggers on either branch to be safe

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular App
        run: npm run build -- --base-href /

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build
          path: dist/portfolio/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-build
          path: dist/portfolio/browser

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Confirm Files Before Deploy
        run: |
          echo "Current working directory: $(pwd)"
          echo "Current Git branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Confirming built files exist in dist/portfolio/browser:"
          ls -la dist/portfolio/browser

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx angular-cli-ghpages --dir=dist/portfolio/browser --branch=gh-pages --no-silent --message "Deploying from GitHub Actions - $(date)"


