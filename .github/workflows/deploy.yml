name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main # Your default branch

# Permissions needed for deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Update to 24
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4️⃣ Install Angular CLI globally
      - name: Install Angular CLI
        run: npm install -g @angular/cli

      # 5️⃣ Build Angular App
      - name: Build Angular
        run: ng build --base-href /

      # 6️⃣ Deploy using angular-cli-ghpages
      - name: Deploy to GH Pages
        run: npx angular-cli-ghpages --dir=dist/portfolio/browser --branch=gh-pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_PAT }}
