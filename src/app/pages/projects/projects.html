<section class="projects section container">
    <div class="section-header">
        <h2 class="section-title">Projects</h2>
        <p class="section-subtitle">A showcase of the systems I've built and technologies I've mastered</p>
    </div>

    <div class="project-grid">
        @for (project of projects; track project.title) {
        <div class="project-card">
            <div class="project-image-wrapper">
                <img src="/project_placeholder_1774150214610.png" [alt]="project.title" class="project-image">
                <div class="project-overlay">
                    <a [href]="project.link" class="btn-icon"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                </div>
            </div>
            <div class="project-info">
                <h3 class="project-title">{{ project.title }}</h3>
                <p class="project-description">{{ project.description }}</p>
                <div class="project-tech">
                    @for (tag of project.tech; track tag) {
                    <span class="tech-tag">{{ tag }}</span>
                    }
                </div>
            </div>
        </div>
        }
    </div>
</section>
